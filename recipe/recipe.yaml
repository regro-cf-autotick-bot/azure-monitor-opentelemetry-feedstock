# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: 1.8.10

package:
  name: azure-monitor-opentelemetry
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/azure-monitor-opentelemetry/azure_monitor_opentelemetry-${{ version }}.tar.gz
  sha256: 8400df75435db66f25584bb053265b13e1f97cf42f1d1cb4851699bdec075ad2

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - azure-core <2.0.0,>=1.28.0
    - azure-core-tracing-opentelemetry >=1.0.0b11,<1.1.dev0
    - azure-monitor-opentelemetry-exporter >=1.0.0b57,<1.1.dev0
    - opentelemetry-instrumentation-django >=0.65b0,<0.66b0
    - opentelemetry-instrumentation-fastapi >=0.65b0,<0.66b0
    - opentelemetry-instrumentation-flask >=0.65b0,<0.66b0
    - opentelemetry-instrumentation-logging >=0.65b0,<0.66b0
    - opentelemetry-instrumentation-psycopg2 >=0.65b0,<0.66b0
    - opentelemetry-instrumentation-requests >=0.65b0,<0.66b0
    - opentelemetry-instrumentation-urllib >=0.65b0,<0.66b0
    - opentelemetry-instrumentation-urllib3 >=0.65b0,<0.66b0
    - opentelemetry-resource-detector-azure <1.0.0,>=0.2.0
    - opentelemetry-sdk >=1.44.0,<1.45.dev0
    - opentelemetry-instrumentation-httpx >=0.65b0,<0.66b0
tests:
  - python:
      imports:
        - azure
        - azure.monitor.opentelemetry
        - azure.monitor.opentelemetry._autoinstrumentation
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - '*'

about:
  summary: Microsoft Azure Monitor Opentelemetry Distro Client Library for Python
  homepage: https://github.com/Azure/azure-sdk-for-python/tree/main/sdk/monitor/azure-monitor-opentelemetry
  description: |
    Microsoft Azure Monitor Opentelemetry Distro Client Library for Python.
  repository: https://github.com/Azure/azure-sdk-for-python/tree/main/sdk/monitor/azure-monitor-opentelemetry
  documentation: https://github.com/Azure/azure-sdk-for-python/blob/main/sdk/monitor/azure-monitor-opentelemetry/README.md
  license: Apache-2.0 AND MIT
  license_file:
    - LICENSE
    - NOTICE.txt

extra:
  recipe-maintainers:
    - rxm7706
    - conda-forge/opentelemetry-api
